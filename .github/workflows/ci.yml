name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ppd
          POSTGRES_PASSWORD: ppd
          POSTGRES_DB: ppd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ppd" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PPD_PG_DSN: postgresql://ppd:ppd@localhost:5432/ppd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,dbt]"
      - name: Lint
        run: ruff check src tests airflow
      - name: Unit and integration tests (fixture data)
        run: pytest
      - name: End-to-end run on fixture data (Spark -> dbt -> site extract)
        run: make e2e-fixture

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pipeline image
        run: docker build -f docker/Dockerfile -t ppd-pipeline:ci .
